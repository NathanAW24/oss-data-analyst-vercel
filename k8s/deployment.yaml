apiVersion: apps/v1
kind: Deployment
metadata:
  name: bes-oss-data-analyst-vercel
  namespace: aidc-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bes-oss-data-analyst-vercel
  template:
    metadata:
      labels:
        app: bes-oss-data-analyst-vercel
    spec:
      containers:
      - name: bes-oss-data-analyst-vercel # must change
        image: evuedsoacr.azurecr.io/bes-app/bes-oss-data-analyst-vercel:latest # must change
        env:
          - name: NEXT_PUBLIC_API_URL
            valueFrom:
              secretKeyRef:
                name: bes-oss-data-analyst-vercel-secrets
                key: NEXT_PUBLIC_API_URL
          - name: NODE_ENV
            valueFrom:
              secretKeyRef:
                name: bes-oss-data-analyst-vercel-secrets
                key: NODE_ENV
          - name: OPENAI_BASE_URL
            valueFrom:
              secretKeyRef:
                name: bes-oss-data-analyst-vercel-secrets
                key: OPENAI_BASE_URL
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: bes-oss-data-analyst-vercel-secrets
                key: OPENAI_API_KEY
          - name: PGHOST
            valueFrom:
              secretKeyRef:
                name: bes-oss-data-analyst-vercel-secrets
                key: PGHOST
          - name: PGPORT
            valueFrom:
              secretKeyRef:
                name: bes-oss-data-analyst-vercel-secrets
                key: PGPORT
          - name: PGUSER
            valueFrom:
              secretKeyRef:
                name: bes-oss-data-analyst-vercel-secrets
                key: PGUSER
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: bes-oss-data-analyst-vercel-secrets
                key: PGPASSWORD
          - name: PGDATABASE
            valueFrom:
              secretKeyRef:
                name: bes-oss-data-analyst-vercel-secrets
                key: PGDATABASE
          - name: PGSSLMODE
            valueFrom:
              secretKeyRef:
                name: bes-oss-data-analyst-vercel-secrets
                key: PGSSLMODE
          - name: ALLOWED_SCHEMAS
            valueFrom:
              secretKeyRef:
                name: bes-oss-data-analyst-vercel-secrets
                key: ALLOWED_SCHEMAS
          - name: LOCAL_NO_SANDBOX
            valueFrom:
              secretKeyRef:
                name: bes-oss-data-analyst-vercel-secrets
                key: LOCAL_NO_SANDBOX
          - name: RABBITMQ_URL
            valueFrom:
              secretKeyRef:
                name: bes-oss-data-analyst-vercel-secrets
                key: RABBITMQ_URL
        ports:
          - containerPort: 3000
        resources:
          requests:
            memory: "200Mi"   # Guaranteed memory allocation
            cpu: "500m"     # Guaranteed CPU allocation
          limits:
            memory: "500Mi"   # Maximum memory the container can use
            cpu: "500m"    # Maximum CPU the container can use
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
      imagePullSecrets:
        - name: acr-registry-secret
